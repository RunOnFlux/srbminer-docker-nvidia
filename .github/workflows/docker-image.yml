name: Build from SRBMiner-Multi releases -> GHCR

on:
  schedule:
    - cron: "47 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if this version is already published"
        type: boolean
        default: false
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  packages: write

# A scheduled run and a push landing together would otherwise race to the same tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: doktor83/SRBMiner-Multi
      IMAGE: ghcr.io/runonflux/srbminer-docker-nvidia

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get latest SRBMiner-Multi release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Could not fetch latest release tag"
            exit 1
          fi

          DOCKER_TAG="${TAG#v}"

          echo "upstream_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest SRBMiner-Multi: $TAG  -> Docker tag: $DOCKER_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pushes to master and PRs always build, so a Dockerfile or entrypoint change
      # reaches the published tags. Scheduled and manual runs only build a new
      # upstream release, unless forced.
      - name: Check if this version is already published
        id: check
        run: |
          REF="${IMAGE}:${{ steps.rel.outputs.docker_tag }}"

          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "${REF} exists: ${EXISTS}"

          case "${{ github.event_name }}" in
            push|pull_request) SKIP=false ;;
            *)
              if [ "$EXISTS" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
                SKIP=true
              else
                SKIP=false
              fi
              ;;
          esac

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Skip build: $SKIP"

      - name: Build
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            SRBMINER_VERSION=${{ steps.rel.outputs.upstream_tag }}
          tags: srbminer-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SRBMiner itself cannot be exercised here: on GitHub's runners it prints nothing
      # and exits 0, even for --version, and it needs a GPU anyway. So this checks the
      # image around it: the binary is in place, the entrypoint rejects a missing
      # config, and, with a stub in place of the miner, a start without a terminal (the
      # way Kubernetes starts it) hands the miner a terminal and its arguments intact.
      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          echo "::group::Binary"
          docker run --rm --entrypoint sh srbminer-test -c 'test -x ./SRBMiner-MULTI && head -c 4 ./SRBMiner-MULTI | grep -q ELF && echo "SRBMiner-MULTI is an executable ELF"'
          echo "::endgroup::"

          echo "::group::Entrypoint without config"
          if docker run --rm srbminer-test > /tmp/noenv.log 2>&1; then
            cat /tmp/noenv.log
            echo "Expected the entrypoint to fail without ALGO/POOL/WALLET"
            exit 1
          fi
          cat /tmp/noenv.log
          grep -q "ALGO is required" /tmp/noenv.log
          echo "::endgroup::"

          echo "::group::Entrypoint without a terminal (stub miner)"
          STUB="$RUNNER_TEMP/stub-miner"
          # shellcheck disable=SC2016 # the stub's own $@ and $a, written literally
          printf '#!/bin/sh\n[ -t 1 ] && echo "stub: has a terminal"\nfor a in "$@"; do printf "[%%s] " "$a"; done; echo\nexec sleep 60\n' > "$STUB"
          chmod +x "$STUB"
          docker run -d --name srb-stub -v "$STUB:/opt/srbminer/SRBMiner-MULTI:ro" \
            -e ALGO=pearlhash -e POOL=pool.example:3333 -e 'WALLET=prl1$x"y' -e 'WORKER=rig 1' \
            srbminer-test > /dev/null
          sleep 5
          docker logs srb-stub > /tmp/stub.log 2>&1
          docker rm -f srb-stub > /dev/null
          tr -d '\r' < /tmp/stub.log | tee /tmp/stub-clean.log
          grep -q "stub: has a terminal" /tmp/stub-clean.log
          # shellcheck disable=SC2016 # the test wallet value contains a literal $
          grep -qF '[--wallet] [prl1$x"y] [--worker] [rig 1] [--disable-cpu]' /tmp/stub-clean.log
          echo "::endgroup::"

      - name: Push
        if: github.event_name != 'pull_request' && steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SRBMINER_VERSION=${{ steps.rel.outputs.upstream_tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.rel.outputs.docker_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
